name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Full test suite (includes architecture and registry checks)
        run: python -m unittest discover -s tests
      - name: Disposable module removal tests
        run: |
          python tools/removal_test.py reporting
          python tools/removal_test.py selftest
          python tools/removal_test.py providers.mock
      - name: Packaging smoke test
        run: |
          pip wheel . --no-deps -w dist/
          pip install dist/*.whl
          studio --version
          python -c "import las; print(las.__version__)"

  # The product engine and desktop shell are Rust (rust/); the
  # suite runs headless (egui_kittest needs no display, the local
  # HTTP server tests bind loopback only).  rusqlite is bundled,
  # so no system SQLite is needed.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install eframe build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev \
            libwayland-dev wayland-protocols
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test the Rust workspace
        working-directory: rust
        run: cargo test --workspace --locked
      - name: Release build of the desktop shell
        working-directory: rust
        run: cargo build --release -p las-desktop --locked
